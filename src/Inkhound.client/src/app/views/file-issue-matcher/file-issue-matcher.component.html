<p class="text-body-secondary small mb-3">
  {{ files().length }} file(s) found.
  Files matched to a missing issue are pre-selected — assign the others manually or leave them unselected.
</p>

<div class="d-flex align-items-center gap-2 mb-2">
  <input
    type="checkbox"
    class="form-check-input"
    [checked]="allFilesSelected()"
    (change)="onToggleAllFiles()" />
  <label class="small text-body-secondary mb-0" (click)="onToggleAllFiles()" style="cursor: pointer;">Select all</label>
</div>

@for (file of files(); track $index; let i = $index) {
  <div class="file-issue-row" [style.cursor]="isFileAssignable(i) ? 'pointer' : 'default'" (click)="onToggleFile(i)">
    <div class="d-flex align-items-start gap-2">
      <input
        type="checkbox"
        class="form-check-input flex-shrink-0 mt-1"
        [checked]="isFileSelected(i)"
        [disabled]="!isFileAssignable(i)"
        (click)="$event.stopPropagation()"
        (change)="onToggleFile(i)" />
      <div class="file-issue-name flex-grow-1">
        {{ file.name }}
        <span class="text-body-secondary">·</span>
        <span class="text-body-secondary text-nowrap">{{ formatSize(file.size) }}</span>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 mt-2" (click)="$event.stopPropagation()">
      <svg cIcon name="cilLink" size="sm" class="text-body-secondary flex-shrink-0" title="Matched issue"></svg>
      <select class="form-select form-select-sm file-issue-select"
              (change)="onManualAssign(i, $any($event.target).value)">
        <option value="" [selected]="!isFileAssignable(i)">— assign issue —</option>
        @for (issue of availableIssuesFor(i); track issue.id) {
          <option [value]="issue.id"
                  [selected]="currentAssignment(i) === issue.id"
                  [disabled]="!isIssueSelectable(issue)">
            {{ issueOptionLabel(issue) }}
          </option>
        }
      </select>
    </div>
  </div>
}
