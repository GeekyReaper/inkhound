<div class="login-page min-vh-100 d-flex align-items-center justify-content-center px-3 py-5">
  <c-card class="login-card w-100" data-coreui-theme="dark">
    <c-card-body class="p-4 p-sm-5">
      <div class="text-center mb-4">
        <img src="assets/images/inkhound-logo-withtext.svg" alt="InkHound" class="login-logo" />
        <p class="login-tagline mt-3 mb-0">Your BD, comics &amp; manga library — hunted, sorted, ready to read.</p>
      </div>

      <form cForm (ngSubmit)="submit()">
        @if (error(); as e) {
          <c-alert color="danger" class="py-2">{{ e }}</c-alert>
        }

        <c-input-group class="mb-3">
          <span cInputGroupText>
            <svg cIcon name="cilUser"></svg>
          </span>
          <input cFormControl placeholder="Username" name="login" autocomplete="username" autofocus
                 [ngModel]="login()" (ngModelChange)="login.set($event)" />
        </c-input-group>

        <c-input-group class="mb-4">
          <span cInputGroupText>
            <svg cIcon name="cilLockLocked"></svg>
          </span>
          <input cFormControl placeholder="Password" type="password" name="password" autocomplete="current-password"
                 [ngModel]="password()" (ngModelChange)="password.set($event)" />
        </c-input-group>

        <button cButton color="primary" class="w-100 login-submit" type="submit" [disabled]="loading()">
          @if (loading()) {
            <c-spinner size="sm" class="me-2"></c-spinner>Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>

      <div class="login-footer text-center mt-4">InkHound — self-hosted comics pipeline</div>
    </c-card-body>
  </c-card>
</div>
