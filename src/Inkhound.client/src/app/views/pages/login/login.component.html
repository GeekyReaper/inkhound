<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="6" md="8">
        <c-card class="p-4">
          <c-card-body>
            <form cForm (ngSubmit)="submit()">
              <h1>Login</h1>
              <p class="text-body-secondary">Sign in to your account</p>

              @if (error()) {
                <div class="alert alert-danger">{{ error() }}</div>
              }

              <c-input-group class="mb-3">
                <span cInputGroupText>
                  <svg cIcon name="cilUser"></svg>
                </span>
                <input cFormControl placeholder="Username" [ngModel]="login()" (ngModelChange)="login.set($event)" name="login" />
              </c-input-group>

              <c-input-group class="mb-4">
                <span cInputGroupText>
                  <svg cIcon name="cilLockLocked"></svg>
                </span>
                <input cFormControl placeholder="Password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />
              </c-input-group>

              <button cButton color="primary" class="px-4 w-100" type="submit" [disabled]="loading()">
                {{ loading() ? 'Signing in…' : 'Login' }}
              </button>
            </form>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
