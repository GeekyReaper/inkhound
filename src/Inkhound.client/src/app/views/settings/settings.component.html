<div class="container-lg px-4">
  <div class="row">
    <div class="col-12">      
      <c-nav variant="tabs" class="mb-3">
        @for (name of services(); track name) {
          <c-nav-item>
            <button cNavLink [active]="activeTab() === name" (click)="activeTab.set(name)">
              {{ name }}
            </button>
          </c-nav-item>
        }
      </c-nav>

      @for (name of services(); track name) {
        @if (activeTab() === name) {
          <div class="tab-pane active">
          </div>
        }
      }
    </div>
  </div>
</div>
