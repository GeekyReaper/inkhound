<c-container class="py-4">

  @if (loading()) {
    <c-row>
      <c-col class="d-flex justify-content-center py-5">
        <c-spinner color="primary"></c-spinner>
      </c-col>
    </c-row>
  } @else if (error()) {
    <c-row>
      <c-col>
        <c-alert color="danger">{{ error() }}</c-alert>
      </c-col>
    </c-row>
  } @else if (library()) {
    <c-row class="mb-4 align-items-center">
      <c-col>
        <h2 class="mb-0">{{ library()!.name }}</h2>
      </c-col>
      <c-col xs="auto">
        <button cButton color="primary" [disabled]="syncing()" (click)="synchronize()">
          @if (syncing()) {
            <c-spinner size="sm" class="me-2"></c-spinner>Synchronizing…
          } @else {
            Synchronize
          }
        </button>
      </c-col>
    </c-row>

    @if (syncDone()) {
      <c-row class="mb-3">
        <c-col md="8" lg="6">
          <c-alert color="success" [dismissible]="true" (visibleChange)="syncDone.set(null)">
            {{ syncDone() }}
          </c-alert>
        </c-col>
      </c-row>
    }

    <c-row>
      <c-col md="8" lg="6">
        <c-card>
          <c-card-body>
            <dl class="row mb-0">
              <dt class="col-sm-4">Path</dt>
              <dd class="col-sm-8"><code>{{ library()!.path }}</code></dd>

              <dt class="col-sm-4">Kavita Library</dt>
              <dd class="col-sm-8">{{ getKavitaLibraryName(library()!.kavitaLibraryId) }}</dd>

              <dt class="col-sm-4">Created</dt>
              <dd class="col-sm-8 mb-0">{{ library()!.createdAt | date:'medium' }}</dd>
            </dl>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  }

</c-container>
