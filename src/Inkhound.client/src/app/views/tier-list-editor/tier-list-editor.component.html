<div class="table-responsive">
  <table cTable small bordered class="mb-2 align-middle">
    <thead>
      <tr>
        @for (col of columns(); track col.key) {
          <th>{{ col.label }}</th>
        }
        <th class="text-end" style="width: 1%"></th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          @for (col of columns(); track col.key) {
            <td>
              <input
                class="form-control form-control-sm"
                [type]="col.type"
                [step]="col.type === 'number' ? 'any' : null"
                [value]="row[col.key] ?? ''"
                [placeholder]="col.nullable ? '(any source)' : ''"
                (change)="updateCell($index, col, $any($event.target).value)" />
            </td>
          }
          <td class="text-end">
            <button cButton color="danger" variant="ghost" size="sm" type="button" (click)="removeRow($index)">
              <svg cIcon name="cilTrash" size="sm"></svg>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns().length + 1" class="text-body-secondary fst-italic text-center py-3">
            No rows.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<button cButton color="secondary" variant="outline" size="sm" type="button" (click)="addRow()">
  <svg cIcon name="cilPlus" size="sm" class="me-1"></svg>
  Add a row
</button>
