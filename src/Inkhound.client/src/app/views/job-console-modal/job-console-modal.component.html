<c-modal
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  size="xl"
  [scrollable]="true"
>
  <c-modal-header>
    <h5 cModalTitle>
      Logs — {{ job()?.title ?? '' }}
      <c-badge [color]="statusColor(job()?.state ?? '')" class="ms-2">
        {{ job()?.state }}
      </c-badge>
    </h5>
    <button cButtonClose (click)="close()"></button>
  </c-modal-header>
  <c-modal-body>
    <app-trace-console [traces]="traces()" emptyText="No trace captured for this job." />
  </c-modal-body>
</c-modal>
